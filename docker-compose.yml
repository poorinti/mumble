name: mumbledocker
services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: roip-gateway
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      command-center:
        condition: service_healthy
    networks:
      - roip-net

  command-center:
    build:
      context: .
    container_name: roip-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-roip}:${POSTGRES_PASSWORD:-roip-change-me}@postgres:5432/${POSTGRES_DB:-roip}
      CONTROL_SERVICE_URL: http://control-service:5100
      RECORDS_DIR: /app/static/records
      LEGACY_DB_FILE: /app/tactical.db
      SERVERS_FILE: /app/servers.json
    expose:
      - "5000"
    volumes:
      - ./servers.json:/app/servers.json
      - ./tactical.db:/app/tactical.db
      - ./static/records:/app/static/records
      - ./.secret_key:/app/.secret_key
    depends_on:
      postgres:
        condition: service_healthy
      control-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 2g
    cpus: 2.0
    networks:
      - roip-net

  control-service:
    build:
      context: .
      dockerfile: Dockerfile.control
    container_name: roip-control
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ROIP_DOCKER_NETWORK: mumbledocker_roip-net
    expose:
      - "5100"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5100/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 256m
    cpus: 0.5
    networks:
      - roip-net

  postgres:
    image: postgres:17.10-bookworm
    container_name: roip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-roip}
      POSTGRES_USER: ${POSTGRES_USER:-roip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-roip-change-me}
      TZ: Asia/Bangkok
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-roip} -d ${POSTGRES_DB:-roip}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0
    networks:
      - roip-net

  mumble-node1:
    image: ${MUMBLE_IMAGE:-mumblevoip/mumble-server:v1.5.915-1}
    container_name: roip-mumble1
    environment:
      - MUMBLE_CONFIG_ICE=tcp -h 0.0.0.0 -p 6502
      - MUMBLE_CONFIG_ICESECRETWRITE=${MUMBLE_ICE_SECRET:-tactical1234}
      - MUMBLE_CONFIG_ICESECRETREAD=${MUMBLE_ICE_SECRET:-tactical1234}
    labels:
      roip.managed: "true"
      roip.station_id: "2"
      roip.data_volume: "mumble-data1"
    ports:
      - "64740:64738/tcp"
      - "64740:64738/udp"
    volumes:
      - mumble-data1:/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    networks:
      - roip-net

  mumble-node2:
    image: ${MUMBLE_IMAGE:-mumblevoip/mumble-server:v1.5.915-1}
    container_name: roip-mumble2
    environment:
      - MUMBLE_CONFIG_ICE=tcp -h 0.0.0.0 -p 6502
      - MUMBLE_CONFIG_ICESECRETWRITE=${MUMBLE_ICE_SECRET:-tactical1234}
      - MUMBLE_CONFIG_ICESECRETREAD=${MUMBLE_ICE_SECRET:-tactical1234}
    labels:
      roip.managed: "true"
      roip.station_id: "3"
      roip.data_volume: "mumble-data2"
    ports:
      - "64741:64738/tcp"
      - "64741:64738/udp"
    volumes:
      - mumble-data2:/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    networks:
      - roip-net

  mumble-node3:
    image: ${MUMBLE_IMAGE:-mumblevoip/mumble-server:v1.5.915-1}
    container_name: roip-mumble3
    environment:
      - MUMBLE_CONFIG_ICE=tcp -h 0.0.0.0 -p 6502
      - MUMBLE_CONFIG_ICESECRETWRITE=${MUMBLE_ICE_SECRET:-tactical1234}
      - MUMBLE_CONFIG_ICESECRETREAD=${MUMBLE_ICE_SECRET:-tactical1234}
    labels:
      roip.managed: "true"
      roip.station_id: "4"
      roip.data_volume: "mumble-data3"
    ports:
      - "64742:64738/tcp"
      - "64742:64738/udp"
    volumes:
      - mumble-data3:/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    networks:
      - roip-net

  mumble-node4:
    image: ${MUMBLE_IMAGE:-mumblevoip/mumble-server:v1.5.915-1}
    container_name: roip-mumble4
    environment:
      - MUMBLE_CONFIG_ICE=tcp -h 0.0.0.0 -p 6502
      - MUMBLE_CONFIG_ICESECRETWRITE=${MUMBLE_ICE_SECRET:-tactical1234}
      - MUMBLE_CONFIG_ICESECRETREAD=${MUMBLE_ICE_SECRET:-tactical1234}
    labels:
      roip.managed: "true"
      roip.station_id: "5"
      roip.data_volume: "mumble-data4"
    ports:
      - "64743:64738/tcp"
      - "64743:64738/udp"
    volumes:
      - mumble-data4:/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    networks:
      - roip-net

volumes:
  postgres-data:
  mumble-data1:
  mumble-data2:
  mumble-data3:
  mumble-data4:

networks:
  roip-net:
    name: mumbledocker_roip-net
    driver: bridge
