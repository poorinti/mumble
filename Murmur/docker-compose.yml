version: '3.8'

services:
  command-center:
    build: .
    container_name: roip-web
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    restart: always
    networks:
      - roip-net

  mumble-node1:
    image: mumblevoip/mumble-server:latest
    container_name: roip-mumble1
    # ?????????????: ????????? mumble-server ???????????? ICE ???????????? IP (0.0.0.0)
    command: 
      - mumble-server
      - -fg
      - -ice
      - "tcp -h 0.0.0.0 -p 6502"
    environment:
      - MUMBLE_ICE_ENDPOINT=tcp -h 0.0.0.0 -p 6502
    ports:
      - "64740:64738/tcp"
      - "64740:64738/udp"
    restart: always
    networks:
      - roip-net

